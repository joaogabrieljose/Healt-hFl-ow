services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: healthflow
      RABBITMQ_DEFAULT_PASS: healthflow
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5438:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  patient-postgres:
    image: postgres:16-alpine
    container_name: patient-postgres
    environment:
      POSTGRES_DB: patiente
      POSTGRES_USER: post_user
      POSTGRES_PASSWORD: post_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - patient_postgres_data:/var/lib/postgresql/data
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post_user -d patiente"]
      interval: 10s
      timeout: 5s
      retries: 5

  doctor-postgres:
    image: postgres:16-alpine
    container_name: doctor-postgres
    environment:
      POSTGRES_DB: doctor
      POSTGRES_USER: doctor_user
      POSTGRES_PASSWORD: doctor_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - doctor_postgres_data:/var/lib/postgresql/data
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor_user -d doctor"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduling-postgres:
    image: postgres:16-alpine
    container_name: scheduling-postgres
    environment:
      POSTGRES_DB: scheduling
      POSTGRES_USER: scheduling_user
      POSTGRES_PASSWORD: scheduling_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5436:5432"
    volumes:
      - scheduling_postgres_data:/var/lib/postgresql/data
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduling_user -d scheduling"]
      interval: 10s
      timeout: 5s
      retries: 5

  triage-postgres:
    image: postgres:16-alpine
    container_name: triage-postgres
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5437:5432"
    volumes:
      - triage_postgres_data:/var/lib/postgresql/data
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_user -d triage"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5439:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-postgres:
    image: postgres:16-alpine
    container_name: audit-postgres
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5440:5432"
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    networks:
      - healthflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_password
      JWT_SECRET: healthflow-secret-key
    ports:
      - "8085:8085"
    networks:
      - healthflow-network

  patient-service:
    build:
      context: ./patient-service
    container_name: patient-service
    depends_on:
      patient-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-postgres:5432/patiente
      SPRING_DATASOURCE_USERNAME: post_user
      SPRING_DATASOURCE_PASSWORD: post_password
    ports:
      - "8081:8081"
    networks:
      - healthflow-network

  doctor-service:
    build:
      context: ./doctor-service
    container_name: doctor-service
    depends_on:
      doctor-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://doctor-postgres:5432/doctor
      SPRING_DATASOURCE_USERNAME: doctor_user
      SPRING_DATASOURCE_PASSWORD: doctor_password
    ports:
      - "8082:8082"
    networks:
      - healthflow-network

  scheduling-service:
    build:
      context: ./scheduling-service
    container_name: scheduling-service
    depends_on:
      scheduling-postgres:
        condition: service_healthy
      patient-service:
        condition: service_started
      doctor-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:postgresql://scheduling-postgres:5432/scheduling
      SPRING_DATASOURCE_USERNAME: scheduling_user
      SPRING_DATASOURCE_PASSWORD: scheduling_password

      SERVICES_PATIENT_URL: http://patient-service:8081
      SERVICES_DOCTOR_URL: http://doctor-service:8082

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: healthflow
      SPRING_RABBITMQ_PASSWORD: healthflow
    ports:
      - "8083:8083"
    networks:
      - healthflow-network

  triage-service:
    build:
      context: ./triage-service
    container_name: triage-service
    depends_on:
      triage-postgres:
        condition: service_healthy
      patient-service:
        condition: service_started
      scheduling-service:
        condition: service_started
    environment:
      SERVER_PORT: 8084

      SPRING_DATASOURCE_URL: jdbc:postgresql://triage-postgres:5432/triage
      SPRING_DATASOURCE_USERNAME: triage_user
      SPRING_DATASOURCE_PASSWORD: triage_password

      SERVICES_PATIENT_URL: http://patient-service:8081
      SERVICES_SCHEDULING_URL: http://scheduling-service:8083
    ports:
      - "8084:8084"
    networks:
      - healthflow-network

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086

      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-postgres:5432/notification
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification_password

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: healthflow
      SPRING_RABBITMQ_PASSWORD: healthflow
    ports:
      - "8086:8086"
    networks:
      - healthflow-network

  audit-service:
    build:
      context: ./audit-service
    container_name: audit-service
    depends_on:
      audit-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8087

      SPRING_DATASOURCE_URL: jdbc:postgresql://audit-postgres:5432/audit
      SPRING_DATASOURCE_USERNAME: audit_user
      SPRING_DATASOURCE_PASSWORD: audit_password

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: healthflow
      SPRING_RABBITMQ_PASSWORD: healthflow
    ports:
      - "8087:8087"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=audit-service"
    networks:
      - healthflow-network

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - scheduling-service
      - triage-service
      - notification-service
      - audit-service
      - jaeger
    environment:
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: gateway

      JWT_SECRET: healthflow-secret-key

      AUTH_SERVICE_URL: http://auth-service:8085
      PATIENT_SERVICE_URL: http://patient-service:8081
      DOCTOR_SERVICE_URL: http://doctor-service:8082
      SCHEDULING_SERVICE_URL: http://scheduling-service:8083
      TRIAGE_SERVICE_URL: http://triage-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      AUDIT_SERVICE_URL: http://audit-service:8087

      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8080:8080"
    networks:
      - healthflow-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - gateway
      - auth-service
      - patient-service
      - doctor-service
      - scheduling-service
      - triage-service
      - notification-service
      - audit-service
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - healthflow-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - healthflow-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    networks:
      - healthflow-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - healthflow-network

volumes:
  auth_postgres_data:
  patient_postgres_data:
  doctor_postgres_data:
  scheduling_postgres_data:
  triage_postgres_data:
  notification_postgres_data:
  audit_postgres_data:
  rabbitmq_data:
  grafana_data:
  loki_data:

networks:
  healthflow-network:
    driver: bridge