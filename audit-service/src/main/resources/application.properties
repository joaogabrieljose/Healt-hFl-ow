spring.application.name=audit-service
server.port=${SERVER_PORT:8087}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/audit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:audit_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:audit_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:healthflow}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:healthflow}

# Queues consumidas pelo audit-service
healthflow.rabbitmq.audit-appointment-created-queue=audit.appointment.created.queue
healthflow.rabbitmq.audit-appointment-status-changed-queue=audit.appointment.status.changed.queue

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha