global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["auth-service:8085"]

  - job_name: "patient-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["patient-service:8081"]

  - job_name: "doctor-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["doctor-service:8082"]

  - job_name: "scheduling-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["scheduling-service:8083"]

  - job_name: "triage-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["triage-service:8084"]

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8086"]

  - job_name: "audit-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["audit-service:8087"]