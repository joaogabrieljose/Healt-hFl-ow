spring.application.name=triage-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5437/triage
spring.datasource.username=triage_user
spring.datasource.password=triage_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

services.patient.url=http://localhost:8081
services.scheduling.url=http://localhost:8083
