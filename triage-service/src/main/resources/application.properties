spring.application.name=triage-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/triage}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:triage_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:triage_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

services.patient.url=${SERVICES_PATIENT_URL:http://localhost:8081}
services.scheduling.url=${SERVICES_SCHEDULING_URL:http://localhost:8083}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true