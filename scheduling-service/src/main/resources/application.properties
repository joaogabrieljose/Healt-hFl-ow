spring.application.name=scheduling-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/scheduling}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scheduling_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scheduling_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

services.patient.url=${SERVICES_PATIENT_URL:http://localhost:8081}
services.doctor.url=${SERVICES_DOCTOR_URL:http://localhost:8082}