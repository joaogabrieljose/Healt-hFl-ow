services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduling-postgres
    environment:
      POSTGRES_DB: scheduling
      POSTGRES_USER: scheduling_user
      POSTGRES_PASSWORD: scheduling_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5436:5432"
    volumes:
      - scheduling_postgres_data:/var/lib/postgresql/data
    networks:
      - scheduling-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduling_user -d scheduling"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scheduling_postgres_data:
    driver: local

networks:
  scheduling-network:
    driver: bridge