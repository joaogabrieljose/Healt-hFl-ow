services:
  postgres:
    image: postgres:16-alpine
    container_name: patiente-postgres
    environment:
      POSTGRES_DB: patiente
      POSTGRES_USER: post_user
      POSTGRES_PASSWORD: post_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - patiente-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post_user -d patiente"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  patiente-network:
    driver: bridge