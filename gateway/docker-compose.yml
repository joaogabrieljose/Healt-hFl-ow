services:
  gateway:
    build:
      context: .
    container_name: gateway
    environment:
      SERVER_PORT: 8080

      JWT_SECRET: healthflow-secret-key

      AUTH_SERVICE_URL: http://host.docker.internal:8085
      PATIENT_SERVICE_URL: http://host.docker.internal:8081
      DOCTOR_SERVICE_URL: http://host.docker.internal:8082
      SCHEDULING_SERVICE_URL: http://host.docker.internal:8083
      TRIAGE_SERVICE_URL: http://host.docker.internal:8084
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:8086
      AUDIT_SERVICE_URL: http://host.docker.internal:8087

    ports:
      - "8080:8080"


    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=gateway"