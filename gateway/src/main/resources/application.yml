spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: patient-service
              uri: ${PATIENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1

            - id: doctor-service
              uri: ${DOCTOR_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/doctors/**
              filters:
                - StripPrefix=1

            - id: specialty-service
              uri: ${DOCTOR_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/specialties/**
              filters:
                - StripPrefix=1

            - id: scheduling-service
              uri: ${SCHEDULING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/appointments/**
              filters:
                - StripPrefix=1

            - id: appointment-history-service
              uri: ${SCHEDULING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/appointment-history/**
              filters:
                - StripPrefix=1

            - id: triage-service
              uri: ${TRIAGE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/triages/**
              filters:
                - StripPrefix=1

            - id: vital-signs-service
              uri: ${TRIAGE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/vital-signs/**
              filters:
                - StripPrefix=1

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/audit-logs/**
              filters:
                - StripPrefix=1

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always